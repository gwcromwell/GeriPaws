name: Verify

# Reusable — called by both test.yml (every push/PR) and deploy-pages.yml
# (gates the live deploy on the same checks passing).
on:
  workflow_call: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (packages/shared + apps/geripaws-app)
        run: pnpm typecheck

      - name: Lint (apps/geripaws-app)
        run: pnpm lint

      - name: Unit tests (packages/shared + apps/geripaws-app)
        run: pnpm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck every Edge Function
        working-directory: supabase/functions
        run: |
          set -e
          for dir in */; do
            fn="${dir%/}"
            echo "== $fn =="
            deno check "$fn/index.ts"
          done

      - name: Unit tests for Edge Function schedule/timezone logic
        working-directory: supabase/functions
        run: deno test --allow-env send-reminders/schedule-lib.test.ts

      - name: Unit tests for Edge Function CORS handling (pet-sharing invite/link functions)
        working-directory: supabase/functions
        env:
          # get-shared-pet constructs a Supabase client at import time — these
          # only need to be non-empty strings, no real call is made in the
          # cases under test.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-key
        run: |
          deno test --allow-env send-pet-invite/index.test.ts
          deno test --allow-env get-shared-pet/index.test.ts
