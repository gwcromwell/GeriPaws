name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # Deliberately its own job in this main-only workflow, never in verify.yml —
  # verify.yml is also called by test.yml on every branch/PR, and nothing
  # touching the production database may run for those.
  migrate:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply pending migrations
        working-directory: supabase/migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # The direct db.<ref>.supabase.co host is IPv6-only; GitHub-hosted
          # runners' egress for it has been unreliable, so this uses the same
          # IPv4 session pooler verified working by hand.
          PGHOST: aws-0-us-west-2.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.iwespdpcopwxdrmwzbsk
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -e
          # Migration files aren't written to be safely re-run (plain ALTER
          # TABLE ADD COLUMN, not IF NOT EXISTS) — this tracks which have
          # already been applied so only genuinely new files run each deploy.
          psql -v ON_ERROR_STOP=1 -c "
            create table if not exists public._schema_migrations (
              version text primary key,
              applied_at timestamptz not null default now()
            );
          "
          for f in $(ls *.sql | sort); do
            applied=$(psql -tA -c "select 1 from public._schema_migrations where version = '$f';")
            if [ "$applied" = "1" ]; then
              echo "skip (already applied): $f"
            else
              echo "applying: $f"
              psql -v ON_ERROR_STOP=1 -f "$f"
              psql -v ON_ERROR_STOP=1 -c "insert into public._schema_migrations (version) values ('$f');"
            fi
          done

  build:
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Export static web build
        working-directory: apps/geripaws-app
        env:
          GH_PAGES_BUILD: "1"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist

      - name: Prepare for GitHub Pages
        working-directory: apps/geripaws-app/dist
        run: |
          # GitHub Pages has no server-side routing — this is the standard SPA
          # fallback trick so a direct link to a dynamic route (e.g. /pets/abc123)
          # still loads the app shell, which then renders client-side.
          cp index.html 404.html
          # Pages runs Jekyll by default, which silently drops any file/directory
          # starting with an underscore (like _expo/) — this opts out.
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/geripaws-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
