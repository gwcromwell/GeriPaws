packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Native resolver used by eslint-config-expo's import-resolution rules —
  # a known, widely-used package; approved so ESLint gets full functionality.
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22 || 57.0.23'
  - '@expo/ui@57.0.16'
  - expo-modules-core@57.0.16 || 57.0.17
  - expo-modules-jsi@57.0.8 || 57.1.0
  - expo-router@57.0.19
  - expo@57.0.20 || 57.0.21
  - expo-notifications@57.0.17
  - '@expo/metro-file-map@57.0.3'
  - babel-preset-expo@57.0.11
